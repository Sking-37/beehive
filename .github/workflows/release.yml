name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Install gh CLI
        run: |
          curl -fsSL https://github.com/cli/cli/releases/download/v2.65.0/gh_2.65.0_linux_amd64.tar.gz -o /tmp/gh.tar.gz
          tar -xzf /tmp/gh.tar.gz -C /tmp
          mv /tmp/gh_2.65.0_linux_amd64/bin/gh /usr/local/bin/gh
          gh --version

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Check if release already exists (draft or published)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists, editing..."
            gh release edit "$TAG" \
              --title "Beehive $TAG" \
              --repo "$GITHUB_REPOSITORY" \
              dist/beehive-*.whl dist/beehive-*.tar.gz
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" \
              --title "Beehive $TAG" \
              --draft \
              --repo "$GITHUB_REPOSITORY" \
              dist/beehive-*.whl dist/beehive-*.tar.gz
          fi