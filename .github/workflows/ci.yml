name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    # On tag push, skip test job, go straight to build
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[dev]"

      - name: Lint with ruff
        run: |
          python -m pip install ruff
          python -m ruff check . || echo "ruff not configured, skipping"

      - name: Syntax check Python files
        run: |
          find . -name "*.py" -not -path "./.git/*" -not -path "./.venv/*" -not -path "./build/*" | while read f; do
            python -m py_compile "$f" || { echo "FAIL: $f"; exit 1; }
          done
          echo "All syntax checks passed"

      - name: Test import
        run: |
          python -c "import beehive; print('beehive version:', beehive.__version__)"

  build:
    runs-on: ubuntu-latest
    needs: test
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install build
          python -m build
          ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          name: Beehive ${{ github.ref_name }}
          body: |
            🐝 **Beehive ${{ github.ref_name }}**

            多 Agent 协作平台首发版本！

            ## 快速安装
            ```bash
            pip install beehive==${{ github.ref_name }}
            ```
        token: ${{ secrets.GITHUB_TOKEN }}