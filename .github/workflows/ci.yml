name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # On tag push, skip test job, go straight to build
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[dev]"

      - name: Lint with ruff
        run: |
          python -m pip install ruff
          python -m ruff check . || echo "ruff not configured, skipping"

      - name: Syntax check Python files
        run: |
          find . -name "*.py" -not -path "./.git/*" -not -path "./.venv/*" -not -path "./build/*" | while read f; do
            python -m py_compile "$f" || { echo "FAIL: $f"; exit 1; }
          done
          echo "All syntax checks passed"

      - name: Test import
        run: |
          python -c "import beehive; print('beehive version:', beehive.__version__)"

  build:
    runs-on: ubuntu-latest
    needs: test
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install build
          python -m build
          ls -la dist/

      - name: Install gh CLI
        run: |
          curl -fsSL https://github.com/cli/cli/releases/download/v2.65.0/gh_2.65.0_linux_amd64.tar.gz -o /tmp/gh.tar.gz
          tar -xzf /tmp/gh.tar.gz -C /tmp
          mv /tmp/gh_2.65.0_linux_amd64/bin/gh /usr/local/bin/gh
          gh --version

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Tag: $TAG"
          gh release create "$TAG" \
            --title "Beehive $TAG" \
            --repo "$GITHUB_REPOSITORY" \
            dist/beehive-*.whl dist/beehive-*.tar.gz || true
          echo "Done"