name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    # On tag push, skip test job, go straight to build
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[dev]"

      - name: Lint with ruff
        run: |
          python -m pip install ruff
          python -m ruff check . || echo "ruff not configured, skipping"

      - name: Syntax check Python files
        run: |
          find . -name "*.py" -not -path "./.git/*" -not -path "./.venv/*" -not -path "./build/*" | while read f; do
            python -m py_compile "$f" || { echo "FAIL: $f"; exit 1; }
          done
          echo "All syntax checks passed"

      - name: Test import
        run: |
          python -c "import beehive; print('beehive version:', beehive.__version__)"

  build:
    runs-on: ubuntu-latest
    needs: test
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install build
          python -m build
          ls -la dist/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1