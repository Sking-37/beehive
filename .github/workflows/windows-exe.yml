name: Build Windows EXE

on:
  push:
    tags:
      - "v*"

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel from source
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m build
          ls -la dist/

      - name: Install beehive from local wheel
        shell: bash
        run: |
          wheel=$(ls dist/beehive-*.whl)
          python -m pip install "$wheel"
          python -c "import beehive; print('beehive', beehive.__version__, 'installed')"
          # Get installed location for PyInstaller
          pip show beehive | grep Location > /tmp/beehive_loc.txt
          cat /tmp/beehive_loc.txt

      - name: Build exe with PyInstaller
        shell: bash
        run: |
          python -m pip install pyinstaller
          
          # Find beehive install location
          loc=$(python -c "import beehive; import os; print(os.path.dirname(beehive.__file__))")
          echo "beehive installed at: $loc"
          
          # Create entry point wrapper script
          cat > run_beehive.py << 'PYEOF'
          """Entry point for PyInstaller bundled exe"""
          import sys
          import os
          sys.path.insert(0, os.path.dirname(__file__))
          from beehive.cli import main
          main()
          PYEOF

          # Package installed beehive into dist/ as beehive/
          mkdir -p dist/beehive_pkg
          cp -r "$loc"/* dist/beehive_pkg/
          
          # Remove __pycache__ to avoid issues
          find dist/beehive_pkg -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true
          
          pyinstaller --onefile --name beehive --console \
            --add-data "dist/beehive_pkg:beehive" \
            --hidden-import=beehive \
            --hidden-import=beehive.agents \
            --hidden-import=beehive.agents.orchestrator \
            --hidden-import=beehive.agents.executors \
            --hidden-import=beehive.graph \
            --hidden-import=beehive.graph.flow \
            --hidden-import=beehive.state \
            --hidden-import=beehive.llm \
            --hidden-import=beehive.config \
            --hidden-import=beehive.storage \
            --hidden-import=beehive.cli \
            --hidden-import=beehive.__main__ \
            --hidden-import=langgraph \
            --hidden-import=langgraph.graph.state \
            --hidden-import=langchain_core \
            --hidden-import=langchain_core.messages \
            --hidden-import=fastapi \
            --hidden-import=click \
            --hidden-import=rich \
            --hidden-import=rich.console \
            --hidden-import=rich.table \
            --hidden-import=pydantic \
            --hidden-import=pydantic.version \
            --collect-all=langgraph \
            --collect-all=langchain_core \
            --collect-all=rich \
            --noconfirm \
            --distpath dist \
            run_beehive.py

      - name: Verify exe
        shell: bash
        run: |
          ls -lh dist/beehive.exe 2>/dev/null || echo "EXE not found!"
          file dist/beehive.exe 2>/dev/null || echo "file command not available"

      - name: Install GitHub CLI
        run: |
          Invoke-WebRequest "https://github.com/cli/cli/releases/download/v2.65.0/gh_2.65.0_windows_amd64.zip" -OutFile gh.zip
          Expand-Archive gh.zip -DestinationPath C:\gh -Force
          Add-Content $env:GITHUB_PATH "C:\gh\gh_2.65.0_windows_amd64\bin"

      - name: Upload EXE to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ github.ref_name }}"
          gh release upload "$ver" dist/beehive.exe --repo "$GITHUB_REPOSITORY" --clobber