name: Build Windows EXE

on:
  push:
    tags:
      - "v*"

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel from source
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m build
          dir dist\

      - name: Install beehive from local wheel
        run: |
          python -m pip install dist/beehive-*.whl
          beehive --version

      - name: Build exe with PyInstaller
        run: |
          python -m pip install pyinstaller
          pyinstaller --onefile --name beehive --console `
            --hidden-import=beehive `
            --hidden-import=beehive.agents `
            --hidden-import=beehive.agents.orchestrator `
            --hidden-import=beehive.agents.executors `
            --hidden-import=beehive.graph `
            --hidden-import=beehive.graph.flow `
            --hidden-import=beehive.state `
            --hidden-import=beehive.llm `
            --hidden-import=beehive.config `
            --hidden-import=beehive.storage `
            --hidden-import=langgraph `
            --hidden-import=langgraph.graph.state `
            --hidden-import=langchain_core `
            --hidden-import=langchain_core.messages `
            --hidden-import=fastapi `
            --hidden-import=click `
            --hidden-import=rich `
            --hidden-import=rich.console `
            --hidden-import=rich.table `
            --hidden-import=pydantic `
            --hidden-import=pydantic.version `
            --collect-all=langgraph `
            --collect-all=langchain_core `
            --collect-all=rich `
            --noconfirm `
            dist/beehive.exe

      - name: Install GitHub CLI
        run: |
          Invoke-WebRequest "https://github.com/cli/cli/releases/download/v2.65.0/gh_2.65.0_windows_amd64.zip" -OutFile gh.zip
          Expand-Archive gh.zip -DestinationPath C:\gh -Force
          Add-Content $env:GITHUB_PATH "C:\gh\gh_2.65.0_windows_amd64\bin"

      - name: Upload EXE to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ github.ref_name }}"
          gh release upload "$ver" dist/beehive.exe --repo "$GITHUB_REPOSITORY" --clobber