name: Build Windows EXE

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  build-exe:
    runs-on: windows-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download wheel from CI artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          run-id: ${{ github.event.workflow_run.id }}
          path: ./dist

      - name: Install beehive from local wheel
        run: |
          pip install dist/beehive-*.whl
          beehive --version

      - name: Build exe with PyInstaller
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name beehive --console `
            --add-data "beehive;beehive" `
            --hidden-import=beehive `
            --hidden-import=beehive.agents `
            --hidden-import=beehive.agents.orchestrator `
            --hidden-import=beehive.agents.executors `
            --hidden-import=beehive.graph `
            --hidden-import=beehive.graph.flow `
            --hidden-import=beehive.state `
            --hidden-import=beehive.llm `
            --hidden-import=beehive.config `
            --hidden-import=beehive.storage `
            --hidden-import=langgraph `
            --hidden-import=langgraph.graph.state `
            --hidden-import=langchain_core `
            --hidden-import=fastapi `
            --hidden-import=click `
            --hidden-import=rich `
            --collect-all=langgraph `
            --collect-all=langchain_core `
            --collect-all=rich `
            --noconfirm `
            dist/beehive.exe

      - name: Upload EXE to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the tag for this run
          $tag = "${{ github.event.workflow_run.head_sha }}"
          # Use the release associated with the run or latest
          $exe = "dist/beehive.exe"
          gh release upload "v0.1.2" "$exe" --repo "$GITHUB_REPOSITORY" --clobber